syntax = "proto3";

package fakeproto.test.v1;

option go_package = "github.com/psyhatter/fakeproto/internal/test/gen;testpb";

// SemanticScalars has fields whose names are registered in gofakeit's function
// registry, used to verify that the generator produces semantically correct values.
message SemanticScalars {
  int32  age = 1;
  int32  year = 2;
  int32  month = 3;
  int32  day = 4;
  int32  hour = 5;
  int32  minute = 6;
  int32  second = 7;
  double latitude = 8;
  double longitude = 9;
  double price = 10;
  // email is registered in gofakeit as a string generator; on a numeric field
  // num() must fall back to a random value instead of returning zero.
  int32  email = 11;
  // galaxy is not registered in gofakeit at all; num() must fall back to a
  // random value instead of returning zero.
  int32  galaxy = 12;
  // numerify is registered in gofakeit but requires a mandatory "str" param
  // with no default; str() must fall back to a random value when Generate
  // returns an error.
  string numerify = 13;
}

// AllScalars covers every scalar type defined in proto3.
message AllScalars {
  double   double_field = 1;
  float    float_field = 2;
  int32    int32_field = 3;
  int64    int64_field = 4;
  uint32   uint32_field = 5;
  uint64   uint64_field = 6;
  sint32   sint32_field = 7;
  sint64   sint64_field = 8;
  fixed32  fixed32_field = 9;
  fixed64  fixed64_field = 10;
  sfixed32 sfixed32_field = 11;
  sfixed64 sfixed64_field = 12;
  bool     bool_field = 13;
  string   string_field = 14;
  bytes    bytes_field = 15;
}
